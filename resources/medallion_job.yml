resources:
  jobs:
    medallion:
      name: medallion
      description: NYC taxi trips medallion pipeline, bronze → silver → gold

      # Job parameters reach every task as notebook widgets, so the notebooks keep reading
      # catalog / *_schema exactly as they did when run by hand.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}

      # No cluster settings on the tasks: they run on serverless compute, the only option on Free Edition.
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/00_bronze.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/01_silver.py

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../src/02_gold.py
