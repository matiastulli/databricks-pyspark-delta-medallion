# Bronze sources: one [[sources]] entry per table. Each entry becomes its own ingestion job
# (`ingest_<name>`, generated by resources/__init__.py) running src/00_bronze/ingest.py on its own schedule.
# Adding a table means adding an entry here: no new notebook, no new job YAML.
#
#   name      unique id: the job is ingest_<name>, and ingest.py receives it as its `source` parameter
#   table     fully qualified source table
#   target    table name inside the bronze schema
#   mode      "append"    every run adds a batch (history kept, silver deduplicates)
#             "overwrite" every run replaces the table with a full snapshot (reference data, flat storage)
#   schedule  Quartz cron (seconds minutes hours day-of-month month day-of-week), UTC.
#             In the dev target every schedule is paused, so jobs only run when started by hand.
#
# The cadences are illustrative: the sample tables don't actually change.

[[sources]]
name = "trips"
table = "samples.nyctaxi.trips"
target = "trips"
mode = "append"
schedule = "0 0 5 * * ?"            # daily at 05:00

# TPC-H: related reference tables, re-delivered whole, so each run replaces the previous snapshot.
# samples.tpch.lineitem (30M rows) is left out on purpose to protect Free Edition quota.

[[sources]]
name = "tpch_region"
table = "samples.tpch.region"
target = "tpch_region"
mode = "overwrite"
schedule = "0 0 6 1 * ?"            # monthly, on the 1st at 06:00

[[sources]]
name = "tpch_nation"
table = "samples.tpch.nation"
target = "tpch_nation"
mode = "overwrite"
