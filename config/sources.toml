# Bronze sources: one entry per table. Each entry becomes its own ingestion job, generated by resources/__init__.py,
# that runs src/00_bronze/ingest.py on its own schedule. Adding a table means adding an entry here plus its migration
# (scripts/new_bronze_migration.py): no notebook, no job YAML.
#
#   kind      "table"  a Unity Catalog table, copied by src/00_bronze/ingest.py
#             "files"  files landing in a UC volume, picked up incrementally by src/00_bronze/ingest_files.py
#                      (Auto Loader), which needs volume, path and format instead of table
#   table     fully qualified source table. The bronze table name is derived from it by the naming convention
#             <source_system>_<source_table> (samples.tpch.orders -> tpch_orders), and the job is ingest_<that name>.
#             For files the same convention uses the volume: landing/trips -> landing_trips.
#   mode      "append"    every run adds a batch (history kept, silver deduplicates)
#             "overwrite" every run replaces the table with a full snapshot (reference data, flat storage)
#   schedule  Quartz cron (seconds minutes hours day-of-month month day-of-week), UTC.
#             In the dev target every schedule is paused, so jobs only run when started by hand.
#
# The cadences are illustrative: the sample tables don't actually change.

[[sources]]
kind = "table"
table = "samples.nyctaxi.trips"
mode = "append"
schedule = "0 0 5 * * ?"            # daily at 05:00

# TPC-H: related reference tables, re-delivered whole, so each run replaces the previous snapshot.
# samples.tpch.lineitem (30M rows) is left out on purpose to protect Free Edition quota.

[[sources]]
kind = "table"
table = "samples.tpch.region"
mode = "overwrite"
schedule = "0 0 6 1 * ?"            # monthly, on the 1st at 06:00

[[sources]]
kind = "table"
table = "samples.tpch.nation"
mode = "overwrite"
schedule = "0 0 6 1 * ?"            # monthly, on the 1st at 06:00

[[sources]]
kind = "table"
table = "samples.tpch.supplier"
mode = "overwrite"
schedule = "0 0 6 1,15 * ?"         # twice a month, on the 1st and 15th (Quartz has no "every 14 days")

[[sources]]
kind = "table"
table = "samples.tpch.part"
mode = "overwrite"
schedule = "0 0 6 1,15 * ?"         # twice a month, on the 1st and 15th

[[sources]]
kind = "table"
table = "samples.tpch.partsupp"
mode = "overwrite"
schedule = "0 0 6 1,15 * ?"         # twice a month, on the 1st and 15th

[[sources]]
kind = "table"
table = "samples.tpch.customer"
mode = "overwrite"
schedule = "0 30 6 * * ?"           # daily at 06:30

[[sources]]
kind = "table"
table = "samples.tpch.orders"
mode = "overwrite"
schedule = "0 30 6 * * ?"           # daily at 06:30

# Files landing in a volume, read incrementally by Auto Loader with its own checkpoint. The seed_landing_files job
# writes them; in a real setup another system would drop them there.

[[sources]]
kind = "files"
volume = "landing"
path = "trips"
format = "json"
mode = "append"
schedule = "0 15 5 * * ?"           # daily at 05:15, after the table sources
