name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (local PySpark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # PySpark runs on the JVM.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - run: pip install -r requirements.txt

      - run: pytest
