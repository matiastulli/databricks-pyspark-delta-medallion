resources:
  jobs:
    clean_trips:
      name: clean_trips
      description: Silver. Deduplicates, validates and types trips from bronze into silver and quarantine
      tags:
        layer: silver

      # Runs when its input changes, not on a clock: whenever ingest_trips writes to bronze trips.
      # Paused in the dev target (development mode), so it only runs when started by hand there.
      trigger:
        table_update:
          table_names:
            - ${var.catalog}.${var.bronze_schema}.trips
          condition: ANY_UPDATED
          # Let a burst of writes settle before starting.
          wait_after_last_change_seconds: 60

      max_concurrent_runs: 1

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}

      tasks:
        - task_key: clean_trips
          notebook_task:
            notebook_path: ../src/01_silver/clean_trips.py
